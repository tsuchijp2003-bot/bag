name: bag-monitor

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # 5時間55分で終了

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 設定ファイルをSecretsから生成
        env:
          TARGETS_YAML: ${{ secrets.TARGETS_YAML }}
        run: echo "$TARGETS_YAML" > targets.yml

      - name: モニター起動（ループ）
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python monitor.py

      - name: 次のジョブをトリガー
        if: always()  # タイムアウトで終了しても必ず実行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run run.yml --ref main
